# =============================================================================
# CI — Unit Tests
# =============================================================================
# GitHub Actions workflow for continuous integration (only unit tests).
#
# A workflow is an automated task that GitHub runs on their servers whenever
# certain events happen (push, pull request, etc.). This workflow installs
# dependencies and runs tests that DON'T require external solvers.
#
# Why split unit and integration tests?
#   - Unit tests run fast (milliseconds) because they mock external dependencies
#   - Integration tests run slow (seconds) because they call the real HiGHS solver
#   - Fast feedback loop during development is valuable — so unit tests run on
#     every commit/PR, while integration tests run separately (or on demand)
#
# This workflow runs on every push to main, and on every PR targeting main.
# =============================================================================

# What is this workflow called in the GitHub UI?
name: CI — Unit Tests

# When should this workflow run?
# This section answers: "what event triggers this automation?"
#
# Why is push restricted to main instead of every branch?
#   A feature branch with an open PR satisfies BOTH `push` (any push to that
#   branch) and `pull_request` (the PR's synchronize event) for the same
#   commit. Without this restriction, every push to a branch that already
#   has a PR open would trigger this workflow twice for the same commit.
#   Restricting `push` to main means: pushes to main (e.g. after a merge)
#   trigger it once via `push`, and commits on a feature branch trigger it
#   once via `pull_request` — never both for the same commit.
on:
  push:
    branches: [main]

  # Trigger on pull requests targeting main
  # Useful for: gating PRs on code quality; prevents merging broken code
  pull_request:
    branches: [main]

  # Lets cd-deploy.yml call this workflow as a job (with a real `needs`
  # dependency) instead of racing a separate `workflow_run` event.
  workflow_call:
    inputs:
      # A reusable workflow's own concurrency group applies to BOTH its
      # standalone push/PR trigger and a cd-deploy.yml `uses:` call for the
      # same commit. Without this input to tell the two apart, they'd share
      # a group and cancel each other — cd-deploy.yml sets this to
      # "cd-deploy" so its call lands in a different group than the
      # standalone run.
      concurrency-suffix:
        description: "Distinguishes a cd-deploy.yml call from this workflow's own push/PR trigger for concurrency grouping"
        required: false
        type: string
        default: standalone

# If a new commit is pushed to the same branch/PR while a previous run is
# still in progress, cancel the older run instead of letting both finish.
# Without this, quick successive pushes (or a force-push) would queue up
# redundant runs for commits that are already superseded.
concurrency:
  group: ci-unit-tests-${{ inputs.concurrency-suffix || 'standalone' }}-${{ github.ref }}
  cancel-in-progress: true

# What are the jobs in this workflow?
# A job is a set of steps that run on a clean virtual machine (called a runner).
# Each job gets its own fresh environment — no state is shared between runs.
jobs:
  # This job's name (shows in the GitHub UI; used in status checks)
  unit-tests:
    # What kind of machine should this job run on?
    # "ubuntu-latest" = latest Ubuntu Linux, maintained by GitHub
    # After each job, the machine is discarded — next job gets a fresh start
    # This guarantees no leftover state from previous runs
    runs-on: ubuntu-latest

    # A job is a sequence of steps. Each step runs sequentially (one after another).
    steps:
      # Step 1: Fetch the code from the repository
      # Why is this needed? The runner doesn't have code yet — it starts empty.
      # This action checks out the current commit (on push) or PR head (on PR).
      - uses: actions/checkout@v4
        # @v4 = use major version 4 (patches are automatic; breaking changes require manual upgrade)
        # Pinning major versions is standard: it prevents unexpected behavior from breaking changes

      # Step 2: Set up Python on the runner
      # Why? The runner has a default Python (often outdated), so we install the one we want.
      # This ensures every CI run uses Python 3.12, matching our project's requirement.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install all dependencies
      # requirements.txt lists: pytest, pytest-cov, highspy, etc.
      # We install them fresh each run (no cached state from last run).
      # Note: We do NOT use `pip install -e .` in CI because pytest's pythonpath setting
      #       in pyproject.toml already adds src/ to sys.path. The editable install is for
      #       development (so you can `import frameworks_and_drivers.cli` from anywhere in
      #       your venv).
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4: Run unit tests (exclude integration tests)
      # pytest -m "not integration" means:
      #   - Find all tests with @pytest.mark.integration
      #   - Exclude them from the run
      # Integration tests require HiGHS (the MIP solver), which makes them slow and fragile
      # in CI. A separate workflow handles them.
      #
      # Coverage reporting:
      #   - --cov=src: measure only the src/ directory (where the actual code lives)
      #   - --cov-report=xml: generate Cobertura XML (kept for future local/tooling use)
      #   - --cov-report=html: generate HTML report as a workflow artifact for detailed inspection
      - name: Run unit tests with coverage
        run: pytest -m "not integration" --cov=src --cov-report=xml --cov-report=html

      # Step 5: Upload HTML coverage report as artifact
      # The HTML report is accessible from the Actions tab for detailed inspection.
      # Useful for: understanding which lines aren't covered, finding test gaps.
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30
