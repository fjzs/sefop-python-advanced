<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knapsack Solver Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header class="page-header">
      <h1>Knapsack Solver Service</h1>
      <p class="subtitle">
        Pick the products that pack the most calories into a budget and a weight limit.
      </p>
    </header>

    <div class="layout">
      <aside class="capacity" aria-label="Capacity">
        <h2 class="section-label">Capacity</h2>
        <div class="capacity-stat">
          <span class="stat-label">Total calories</span>
          <span class="stat-value" id="capacity-calories">—</span>
        </div>
        <div class="gauge" id="gauge-budget">
          <div class="gauge-row">
            <span class="gauge-name">Budget</span>
            <span class="gauge-value" id="gauge-budget-value">— / —</span>
          </div>
          <div class="gauge-track">
            <div class="gauge-fill" id="gauge-budget-fill"></div>
          </div>
        </div>
        <div class="gauge" id="gauge-weight">
          <div class="gauge-row">
            <span class="gauge-name">Weight</span>
            <span class="gauge-value" id="gauge-weight-value">— / —</span>
          </div>
          <div class="gauge-track">
            <div class="gauge-fill" id="gauge-weight-fill"></div>
          </div>
        </div>
      </aside>

      <form id="solve-form">
        <fieldset>
          <legend>Limits</legend>
          <label>
            Max budget (USD)
            <input type="number" id="max-budget-usd" step="0.01" min="0.01" value="10" required />
          </label>
          <label>
            Max weight (kg)
            <input type="number" id="max-weight-kg" step="0.01" min="0.01" value="5" required />
          </label>
        </fieldset>

        <fieldset>
          <legend>Products</legend>
          <table id="products-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Price (USD)</th>
                <th>Weight (kg)</th>
                <th>Calories</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="products-body"></tbody>
          </table>
          <div class="product-actions">
            <button type="button" id="add-product">+ Add product</button>
            <div class="generate-controls">
              <label for="generate-count">Products to generate</label>
              <input type="number" id="generate-count" min="1" max="200" step="1" value="10" />
              <button type="button" id="generate-products">Generate</button>
            </div>
          </div>
        </fieldset>

        <button type="submit" id="solve-button">Solve</button>
      </form>
    </div>

    <section id="result" hidden>
      <h2>Result</h2>
      <div id="result-content"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
